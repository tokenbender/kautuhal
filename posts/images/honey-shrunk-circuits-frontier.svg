<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1728 972" role="img" aria-labelledby="title desc">
  <title id="title">Sparse circuit frontier for generation accuracy versus selected MLP channels</title>
  <desc id="desc">A log-scale frontier chart comparing rank-32 KL-LoRA sparse masks against controls and baselines. The rank-32 KL frontier reaches 90.60 percent generation accuracy at 11,672 MLP channels, while controls need about 167,000 to 180,000 channels to reach 90 percent.</desc>
  <defs>
    <radialGradient id="bg" cx="53%" cy="43%" r="78%">
      <stop offset="0%" stop-color="#071f32"/>
      <stop offset="52%" stop-color="#020d17"/>
      <stop offset="100%" stop-color="#00050a"/>
    </radialGradient>
    <radialGradient id="goldPoint" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffe8aa"/>
      <stop offset="38%" stop-color="#f2b84a"/>
      <stop offset="100%" stop-color="#b36d18"/>
    </radialGradient>
    <radialGradient id="grayPoint" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#d7d1c4"/>
      <stop offset="50%" stop-color="#8f8b82"/>
      <stop offset="100%" stop-color="#4b4a47"/>
    </radialGradient>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <style>
      .title { font: 54px Georgia, "Times New Roman", serif; fill: #f4b64c; }
      .subtitle { font: italic 31px Georgia, "Times New Roman", serif; fill: #e3c092; }
      .axis-label { font: 30px Georgia, "Times New Roman", serif; fill: #f2bd68; }
      .tick { font: 31px Georgia, "Times New Roman", serif; fill: #edc990; }
      .grid { stroke: #9b7138; stroke-width: 1; stroke-dasharray: 2 7; opacity: 0.42; }
      .axis { stroke: #d9ad76; stroke-width: 1.4; }
      .gold-label { font: 23px Georgia, "Times New Roman", serif; fill: #f3b13e; }
      .gray-label { font: 22px Georgia, "Times New Roman", serif; fill: #cfc2af; }
      .legend { font: 22px Georgia, "Times New Roman", serif; fill: #f0c078; }
      .legend-muted { fill: #d1c4b2; }
      .callout-title { font: 27px Georgia, "Times New Roman", serif; fill: #f3b13e; }
      .callout-big { font: 54px Georgia, "Times New Roman", serif; fill: #f4b64c; }
      .callout-mid { font: 24px Georgia, "Times New Roman", serif; fill: #f4c16f; }
      .callout-small { font: 19px Georgia, "Times New Roman", serif; fill: #f2c46e; }
      .takeaway { font: 30px Georgia, "Times New Roman", serif; fill: #f0bd6f; }
      .takeaway-bold { font-weight: 700; fill: #f4b64c; }
    </style>
  </defs>

  <rect width="1728" height="972" fill="url(#bg)"/>
  <rect width="1728" height="972" fill="#000000" opacity="0.18"/>

  <text class="title" x="864" y="62" text-anchor="middle">Sparse Circuit Frontier: Generation Accuracy vs # of MLPs</text>
  <text class="subtitle" x="864" y="105" text-anchor="middle">KL-regularized rank-32 LoRA unlocks high performance with ~95% fewer MLPs.</text>

  <g id="plot">
    <line class="grid" x1="178" y1="152" x2="1625" y2="152"/>
    <line class="grid" x1="178" y1="282" x2="1625" y2="282"/>
    <line class="grid" x1="178" y1="412" x2="1625" y2="412"/>
    <line class="grid" x1="178" y1="542" x2="1625" y2="542"/>
    <line class="grid" x1="178" y1="672" x2="1625" y2="672"/>

    <line class="axis" x1="178" y1="135" x2="178" y2="765"/>
    <line class="axis" x1="166" y1="765" x2="1628" y2="765"/>

    <g class="tick" text-anchor="end">
      <text x="153" y="160">1.0</text>
      <text x="153" y="290">0.8</text>
      <text x="153" y="420">0.6</text>
      <text x="153" y="550">0.4</text>
      <text x="153" y="680">0.2</text>
      <text x="153" y="775">0.0</text>
    </g>
    <g class="tick" text-anchor="middle">
      <text x="246" y="807">10<tspan dy="-14" font-size="18">3</tspan></text>
      <text x="580" y="807">10<tspan dy="-14" font-size="18">4</tspan></text>
      <text x="996" y="807">10<tspan dy="-14" font-size="18">5</tspan></text>
      <text x="1390" y="807">10<tspan dy="-14" font-size="18">6</tspan></text>
    </g>

    <text class="axis-label" x="882" y="845" text-anchor="middle"># of MLPs Selected (log scale)</text>
    <text class="axis-label" x="68" y="460" text-anchor="middle" transform="rotate(-90 68 460)">Generation Accuracy (full-answer)</text>

    <path d="M 333 342 L 421 292 L 558 251 L 695 225 L 944 199" fill="none" stroke="#f3ac2e" stroke-width="3.4"/>
    <path d="M 438 736 L 429 612 L 426 475 L 425 474 M 439 612 L 425 474 M 431 475 L 552 612 L 853 407 L 1398 332 L 1378 382 L 1345 330 L 1408 286" fill="none" stroke="#a99578" stroke-width="2" stroke-dasharray="9 9" opacity="0.95"/>

    <g filter="url(#shadow)">
      <circle cx="333" cy="342" r="12" fill="url(#goldPoint)" stroke="#f6c463" stroke-width="1.5"/>
      <circle cx="421" cy="292" r="12" fill="url(#goldPoint)" stroke="#f6c463" stroke-width="1.5"/>
      <circle cx="558" cy="251" r="12" fill="url(#goldPoint)" stroke="#f6c463" stroke-width="1.5"/>
      <circle cx="695" cy="225" r="12" fill="url(#goldPoint)" stroke="#f6c463" stroke-width="1.5"/>
      <circle cx="944" cy="199" r="12" fill="url(#goldPoint)" stroke="#f6c463" stroke-width="1.5"/>

      <circle cx="438" cy="736" r="11" fill="url(#grayPoint)" stroke="#cfc5b7" stroke-width="1"/>
      <circle cx="429" cy="612" r="11" fill="url(#grayPoint)" stroke="#cfc5b7" stroke-width="1"/>
      <circle cx="426" cy="475" r="11" fill="url(#grayPoint)" stroke="#cfc5b7" stroke-width="1"/>
      <circle cx="853" cy="407" r="11" fill="url(#grayPoint)" stroke="#cfc5b7" stroke-width="1"/>
      <circle cx="1345" cy="330" r="11" fill="url(#grayPoint)" stroke="#cfc5b7" stroke-width="1"/>
      <circle cx="1378" cy="382" r="11" fill="url(#grayPoint)" stroke="#cfc5b7" stroke-width="1"/>
      <circle cx="1408" cy="286" r="11" fill="url(#grayPoint)" stroke="#cfc5b7" stroke-width="1"/>
    </g>

    <g stroke-width="1.3" fill="none">
      <path d="M 295 260 L 326 330" stroke="#f5b33e"/>
      <path d="M 468 205 L 429 282" stroke="#f5b33e"/>
      <path d="M 676 180 L 699 214" stroke="#f5b33e"/>
      <path d="M 988 172 L 954 193" stroke="#f5b33e"/>
      <path d="M 467 430 L 433 468" stroke="#d7c7b5"/>
      <path d="M 469 564 L 434 604" stroke="#d7c7b5"/>
      <path d="M 476 668 L 443 727" stroke="#d7c7b5"/>
      <path d="M 796 520 L 835 425" stroke="#d7c7b5"/>
      <path d="M 1168 300 L 1329 286" stroke="#d7c7b5"/>
      <path d="M 1370 425 L 1360 394" stroke="#d7c7b5"/>
      <path d="M 1378 232 L 1395 279" stroke="#d7c7b5"/>
    </g>

    <g class="gold-label">
      <text x="222" y="230">11,672 MLPs</text>
      <text x="222" y="257">(4.65% of MLPs)</text>
      <text x="222" y="284">90.60% acc</text>

      <text x="414" y="195">12,661 MLPs</text>
      <text x="414" y="222">93.33% acc</text>

      <text x="676" y="162">19,714 MLPs</text>
      <text x="676" y="190">93.20% acc</text>

      <text x="948" y="147">58,619 MLPs</text>
      <text x="948" y="176">99.53% acc</text>
    </g>

    <g class="gray-label">
      <text x="482" y="405">12,026 MLPs</text>
      <text x="482" y="431">(5% dropout)</text>
      <text x="482" y="458">61.20% acc</text>

      <text x="482" y="538">14,436 MLPs</text>
      <text x="482" y="565">(base model composed)</text>
      <text x="482" y="592">29.00% acc</text>

      <text x="486" y="668">12,661 MLPs</text>
      <text x="486" y="695">(random mask)</text>
      <text x="486" y="722">2.20% acc</text>

      <text x="736" y="500">14,175 MLPs</text>
      <text x="736" y="527">(no-KL topk_500)</text>
      <text x="736" y="554">49.53% acc</text>

      <text x="1168" y="267">167,065 MLPs</text>
      <text x="1168" y="295">(no-KL target mask)</text>
      <text x="1168" y="323">90.00% acc</text>

      <text x="1386" y="367">170,259 MLPs</text>
      <text x="1386" y="395">(rank-8 KL)</text>
      <text x="1386" y="423">90.47% acc</text>

      <text x="1386" y="194">179,311 MLPs</text>
      <text x="1386" y="222">(full-SFT KL target mask)</text>
      <text x="1386" y="250">90.80% acc</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="930" y="442" width="342" height="220" rx="12" fill="#020b12" stroke="#e19421" stroke-width="1.8" stroke-dasharray="5 4"/>
      <text class="callout-title" x="1101" y="480" text-anchor="middle">Smallest 90% Mask</text>
      <g transform="translate(1000 526)" fill="none" stroke="#f4b64c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M -22 -24 H 22 V -7 C 22 11 11 23 0 23 C -11 23 -22 11 -22 -7 Z" fill="#f4b64c" fill-opacity="0.22"/>
        <path d="M -22 -15 H -36 C -36 2 -27 9 -22 9"/>
        <path d="M 22 -15 H 36 C 36 2 27 9 22 9"/>
        <path d="M 0 24 V 44"/>
        <path d="M -16 44 H 16"/>
        <path d="M -28 54 H 28"/>
      </g>
      <text class="callout-big" x="1142" y="535" text-anchor="middle">11,672</text>
      <text class="callout-mid" x="1142" y="563" text-anchor="middle">MLPs (4.65% of MLPs)</text>
      <text class="callout-big" x="1098" y="612" text-anchor="middle">90.60%</text>
      <text class="callout-small" x="1098" y="645" text-anchor="middle">fresh generation accuracy</text>
      <circle cx="1000" cy="520" r="43" fill="none" stroke="#e19421" stroke-width="2" stroke-dasharray="4 4"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="1294" y="604" width="346" height="138" rx="10" fill="#020b12" stroke="#e19421" stroke-width="1.5" stroke-dasharray="5 4"/>
      <line x1="1322" y1="635" x2="1390" y2="635" stroke="#f3ac2e" stroke-width="3"/>
      <circle cx="1358" cy="635" r="10" fill="url(#goldPoint)" stroke="#f6c463" stroke-width="1.2"/>
      <text class="legend" x="1398" y="642">KL-LoRA Frontier (rank-32)</text>
      <text class="legend" x="1398" y="672">(Higher is better)</text>
      <line x1="1322" y1="705" x2="1390" y2="705" stroke="#a99578" stroke-width="2" stroke-dasharray="9 8"/>
      <circle cx="1358" cy="705" r="10" fill="url(#grayPoint)" stroke="#cfc5b7" stroke-width="1"/>
      <text class="legend legend-muted" x="1398" y="713">Controls / Baselines</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="162" y="856" width="1400" height="94" rx="12" fill="#020b12" stroke="#d89425" stroke-width="1.3"/>
    <text class="takeaway" x="292" y="897"><tspan class="takeaway-bold">Takeaway:</tspan> KL-regularized rank-32 adaptation reshapes activations so a tiny set of MLP channels</text>
    <text class="takeaway" x="292" y="932">becomes causally sufficient for exact 2-digit addition - with state-of-the-art efficiency.</text>
    <text x="228" y="914" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#f4b64c">*</text>
  </g>
</svg>
